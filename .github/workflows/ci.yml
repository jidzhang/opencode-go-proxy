name: CI

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Ruff
        run: uvx ruff check

  test:
    strategy:
      fail-fast: false
      matrix:
        # The proxy ships Windows service scripts and a macOS supervisor, so
        # the suite must pass where it actually runs, not only on Linux.
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Sync
        run: uv sync

      - name: Tests
        run: uv run python -m pytest tests -v

  macos-app:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build menu bar app
        run: swift build --package-path macos/MenuBarApp

      - name: Menu bar app tests
        run: swift test --package-path macos/MenuBarApp

  package:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Build package
        run: uv build

      - name: Upload wheel
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  release:
    needs: [lint, test, macos-app, package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          generate_release_notes: true
