[project]
name = "opencode-go-proxy"
version = "0.4.10"
description = "Local single-user adapter for using OpenCode Go and Zen models with Codex"
readme = "README.md"
authors = [{ name = "Jidong Zhang" }]
license = "MIT"
requires-python = ">=3.11"
dependencies = ["zstandard>=0.22"]
keywords = ["codex", "opencode", "responses-api", "chat-completions", "agent", "proxy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/jidzhang/opencode-go-proxy"
Repository = "https://github.com/jidzhang/opencode-go-proxy"
Issues = "https://github.com/jidzhang/opencode-go-proxy/issues"

[project.scripts]
opencode-go-proxy = "opencode_go_proxy.app:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
# Pinned so CI does not drift with ruff releases: the base correctness set
# plus import sorting. Wider catalogs (S, RUF, SIM, ...) are opt-in per file.
select = ["E4", "E7", "E9", "F", "I"]
